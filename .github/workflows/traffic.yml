name: Track Repository Traffic

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Archive traffic data
        uses: sangonzal/repository-traffic-action@master
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_ACTION_TOKEN }}
